<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Brak polaczenia | PrawkoNaRaz</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f8fb;
            color: #121826;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 420px);
        }

        .brand {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 12px 32px rgb(15 23 42 / 10%);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.75rem, 8vw, 2.4rem);
            line-height: 1.05;
            letter-spacing: 0;
        }

        p {
            margin: 0;
            color: #5d6678;
            font-size: 1rem;
            line-height: 1.6;
        }

        button {
            margin-top: 28px;
            border: 0;
            border-radius: 12px;
            background: #ff5a3c;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            padding: 13px 18px;
        }
    </style>
</head>
<body>
    <main>
        <img class="brand" src="/pwa/icon-192.png" alt="PrawkoNaRaz">
        <h1>Brak polaczenia</h1>
        <p>Nie udalo sie pobrac tej strony. Sprawdz internet i sprobuj ponownie.</p>
        <button type="button" onclick="window.location.reload()">Odswiez</button>
    </main>
</body>
</html>
