              'docs/NEWSROOM-SEO-DISTRIBUTION-AND-OBSERVABILITY.md',
              'docs/NEWSROOM-TEST-RELEASE-AND-ROLLBACK-RUNBOOK.md',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected changed files: expected={sorted(expected)} actual={sorted(actual)}')
          PY

      - name: Commit documentation sync and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
