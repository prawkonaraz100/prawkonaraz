          ui = 'docs/NEWSROOM-PUBLIC-UI-UX-SPEC.md'
          replace_once(ui,
              '- `NEWSROOM_PUBLIC_ENABLED` pozostaje NEWSROOM-N3-008; historyczne old-slug 301 pozostaje NEWSROOM-N3-006, a newsroomowe rozszerzenie profilu autora NEWSROOM-N3-007,',
