      - name: Validate exact documentation-only diff
        shell: bash
        run: |
          rm .github/workflows/newsroom-n3-006-docs-sync.yml
          git diff --check
          python <<'PY'
          import subprocess
          expected = {
              '.github/workflows/newsroom-n3-006-docs-sync.yml',
              'docs/NEWSROOM-MEDIA-PORTAL-ARCHITECTURE.md',
              'docs/NEWSROOM-IMPLEMENTATION-BACKLOG.md',
              'docs/NEWSROOM-DATA-MODEL-AND-DOMAIN-SPEC.md',
