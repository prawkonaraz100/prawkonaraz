name: Newsroom N3-007 docs sync PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.head_ref == 'docs/newsroom-n3-007-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/newsroom-n3-007-sync
          fetch-depth: 0
      - name: Finalize and validate N3-007 documentation
        shell: bash
        run: bash .github/newsroom-n3-007-docs-finalize.sh
