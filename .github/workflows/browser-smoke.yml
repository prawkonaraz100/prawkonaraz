name: Browser Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/browser-smoke.yml'
      - 'app/Http/Controllers/ContentArticleController.php'
      - 'app/Http/Controllers/PublicQuestionDatabaseController.php'
      - 'app/Http/Controllers/LegalContentController.php'
      - 'app/Http/Controllers/TrafficSignShowController.php'
      - 'app/Http/Controllers/NewsroomPlaceholderController.php'
      - 'app/Http/Controllers/NewsroomCategoryController.php'
      - 'app/Http/Controllers/NewsroomTopicController.php'
      - 'app/Support/ContentArticlePublicCatalogService.php'
      - 'app/Support/NewsroomHomeCompositionService.php'
      - 'app/Support/NewsroomHomeReadModelService.php'
      - 'app/Support/NewsroomCategoryReadModelService.php'
      - 'app/Support/NewsroomCategorySchemaService.php'
      - 'app/Support/NewsroomTopicReadModelService.php'
      - 'app/Support/NewsroomTopicSchemaService.php'
      - 'app/Models/ContentTopic.php'
      - 'app/Support/ContentTopicPublishingService.php'
      - 'app/Support/NewsroomGuideHubReadModelService.php'
      - 'app/Support/NewsroomGuideHubSchemaService.php'
      - 'app/Support/PublicFooter.php'
      - 'app/Support/PublicNavigation.php'
      - 'app/Support/NewsroomArticleBodyRenderer.php'
      - 'app/Support/NewsroomArticlePresentationService.php'
      - 'app/Support/NewsroomSemanticLinkService.php'
      - 'app/Support/NewsroomArticleProductBridgeService.php'
      - 'resources/views/newsroom/**'
      - 'resources/views/components/public/newsroom-reverse-links.blade.php'
      - 'resources/views/questions-database/show.blade.php'
      - 'resources/views/legal-content/show.blade.php'
      - 'resources/views/traffic-signs/show.blade.php'
      - 'resources/views/components/site/home-header.blade.php'
      - 'resources/views/components/site/public-header.blade.php'
      - 'resources/views/components/site/public-footer.blade.php'
      - 'resources/views/components/site/login-drawer.blade.php'
      - 'resources/views/components/site/register-drawer.blade.php'
      - 'resources/js/public-content.ts'
      - 'resources/js/public/newsroomAnalytics.ts'
      - 'resources/js/utils/analytics.ts'
      - 'resources/views/components/analytics/google-tag.blade.php'
      - 'resources/js/Components/SiteHeader.vue'
      - 'resources/js/Components/SiteFooter.vue'
      - 'resources/js/support/public-navigation.ts'
      - 'routes/web.php'
      - 'scripts/e2e-newsroom-article.mjs'
      - 'scripts/e2e-newsroom-category.mjs'
      - 'scripts/e2e-newsroom-guides.mjs'
      - 'scripts/e2e-newsroom-home.mjs'
      - 'scripts/e2e-newsroom-topic.mjs'
      - 'scripts/e2e-newsroom-semantic-links.mjs'
      - 'scripts/e2e-newsroom-golden-path.mjs'
      - 'scripts/newsroom-performance-metrics.mjs'
      - 'package.json'

jobs:
  browser-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      DB_URL: ''
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      MEDIA_LOCAL_ROOT: ${{ github.workspace }}/storage/app/public-media

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare application environment
        run: |
          cp .env.example .env
          mkdir -p database storage/app/public storage/app/public-media
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan storage:link

      - name: Run browser smoke
        run: npm run e2e:smoke

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: output/playwright
          if-no-files-found: warn
          retention-days: 3

  newsroom-article:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      NEWSROOM_PUBLIC_ENABLED: 'true'
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      DB_URL: ''
      CACHE_STORE: file
