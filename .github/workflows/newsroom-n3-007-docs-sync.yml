name: Newsroom N3-007 docs sync

on:
  push:
    branches:
      - docs/newsroom-n3-007-sync

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/newsroom-n3-007-sync
          fetch-depth: 0
      - name: Synchronize N3-007 documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          MAIN = 'c68672f6aa7c41defaeec56debb541d5a60d9f4f'
          OLD = '33d9946219595a4be75d789b19cc8d10efc2ecc0'

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)
          def must_replace(text, old, new, label, count=1):
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{label}: expected at least {count} occurrence(s), got {actual}')
              return text.replace(old, new, count)
          def must_sub(text, pattern, repl, label, count=1, flags=0):
              out, n = re.subn(pattern, repl, text, count=count, flags=flags)
              if n != count:
                  raise SystemExit(f'{label}: expected {count} regex replacement(s), got {n}')
              return out
          def insert_history(text, heading_pattern, entry, label):
              m = re.search(heading_pattern, text, re.M)
              if not m:
                  raise SystemExit(f'{label}: history heading not found')
              pos = m.end()
              return text[:pos] + '\n\n' + entry.rstrip() + '\n' + text[pos:]

          # 1) Canonical architecture
          p = 'docs/NEWSROOM-MEDIA-PORTAL-ARCHITECTURE.md'
          s = read(p)
          s = must_replace(s, f'- **Bazowy stan kodu:** `main@{OLD}`', f'- **Bazowy stan kodu:** `main@{MAIN}`', 'architecture baseline')
          old_state = ('Stan sprawdzony ponownie 2026-09-17 względem `main@'+OLD+'` po wdrożeniu N0, N1-001..N1-006, N2-001..N2-012 oraz NEWSROOM-N3-001..N3-006. Zakres admin/domain N2 jest zamknięty. Public read boundary N3-001, article SEO metadata N3-002, article schema graph N3-003, publiczny article controller/Blade/body renderer N3-004, Product Bridge N3-005 oraz publiczny historical redirect resolver N3-006 są wdrożone. Author-profile integration N3-007, rollout gate N3-008 oraz N4/N5 pozostają otwarte.')
          new_state = ('Stan sprawdzony ponownie 2026-09-17 względem `main@'+MAIN+'` po wdrożeniu N0, N1-001..N1-006, N2-001..N2-012 oraz NEWSROOM-N3-001..N3-007. Zakres admin/domain N2 jest zamknięty. Public read boundary N3-001, article SEO metadata N3-002, article schema graph N3-003, publiczny article controller/Blade/body renderer N3-004, Product Bridge N3-005, publiczny historical redirect resolver N3-006 oraz integracja profilu autora N3-007 są wdrożone. Rollout gate N3-008 oraz N4/N5 pozostają otwarte.')
          s = must_replace(s, old_state, new_state, 'architecture current state')
          anchor = '- modele i publiczne profile `ContentAuthor`,\n'
          addition = (anchor +
              '- N3-007: profil `/autorzy/{slug}` agreguje indeksowalne publikacje Newsroomu z aktywnych kategorii; `published` trafia do bieżących publikacji, `needs_review` do osobnej sekcji „W trakcie weryfikacji”, a `archived` do osobnego „Archiwum”,\n'
              '- N3-007: `ContentAuthorSchemaService` jest współdzielonym builderem `ProfilePage -> Person`; ten sam stabilny `/autorzy/{slug}#person` jest używany przez profil i article graph, a `worksFor` wskazuje `/#organization`,\n'
              '- N3-007: author sitemap kwalifikuje również autorów z indeksowalnym Newsroom corpus i używa `public_state_changed_at` dla newsroomowej świeżości zamiast technicznego `updated_at`,\n'
              '- N3-007: model `ContentAuthor` blokuje odpublikowanie autora, dopóki zależny artykuł Newsroomu pozostaje indexable; noindex usuwa tę blokadę,\n')
          s = must_replace(s, anchor, addition, 'architecture existing elements')
          s = must_replace(s, '- newsroomowej integracji publikacji z profilem autora,\n', '', 'architecture missing author integration')
          s = must_replace(s, '**Stan:** N3-001..N3-006 są zmaterializowane. Author integration N3-007 i rollout gate N3-008 pozostają do wykonania.', '**Stan:** N3-001..N3-007 są zmaterializowane. Rollout gate N3-008 pozostaje do wykonania.', 'architecture N3 state')
          s = re.sub(r'(?m)^(- \[) \](.*N3-007.*)$', r'\1x\2', s)
          s = re.sub(r'(?m)^([^\n]*(?:następn|kolejn)[^\n]*?)N3-007([^\n]*)$', lambda m: m.group(1)+'N3-008'+m.group(2), s, flags=re.I)
          hist = f'''### 2026-09-17 — v0.36

- NEWSROOM-N3-007 zmergowano przez PR #77; finalny implementation head `bf7981d23ff99a6335b55ecaeb6ce36b6622a042`, a zweryfikowany post-merge `main` to `{MAIN}`,
- istniejący `ContentAuthor` i `/autorzy/{{slug}}` pozostają jedyną publiczną tożsamością autora; nie utworzono drugiego modelu/profile surface,
- profil autora agreguje publiczne/indexowalne publikacje Newsroomu z rozdzieleniem `published`, `needs_review` i `archived`, a noindex/scheduled/withdrawn/inactive-category pozostają poza listą,
- wspólny `ContentAuthorSchemaService` utrwala identyczny `Person @id` dla ProfilePage i Article oraz `worksFor -> /#organization`; author sitemap używa newsroomowego `public_state_changed_at`,
- odpublikowanie `ContentAuthor` jest blokowane, gdy zależne artykuły Newsroomu pozostają indexable; regresje potwierdza `ContentAuthorProfileTest`,
- exact-head CI #295 oraz post-merge CI #296 były pełnym PASS; po N3-007 następnym taskiem jest NEWSROOM-N3-008.
'''
          s = insert_history(s, r'^## 29\. Historia zmian\s*$', hist, 'architecture history')
          write(p, s)

          # 2) Implementation backlog — source of execution truth
          p = 'docs/NEWSROOM-IMPLEMENTATION-BACKLOG.md'
          s = read(p)
          execution = '''## 2. Zasada wykonywania

Każdy task przechodzi przez ten sam kontrakt dowodowy, ale kod i dokumentacja mogą być rozdzielone na dwa PR-y, jeżeli implementation PR ma jawny guardrail „no documentation changes”.

### Wariant A — kod i dokumentacja w jednym PR

1. implementacja,
2. testy lokalne pomocniczo,
3. review faktycznie zmienionego kodu,
4. aktualizacja tylko powiązanej dokumentacji,
5. pełny GitHub Actions Quality Gate na finalnym HEAD zawierającym kod i dokumentację,
6. merge,
7. post-merge weryfikacja `main`,
8. dopiero kolejny task.

### Wariant B — implementation PR + osobny docs-sync PR

1. implementacja bez dokumentacji zgodnie z guardrailem PR,
2. review faktycznie zmienionego kodu,
3. pełny GitHub Actions Quality Gate na exact final implementation HEAD,
4. merge implementation PR,
5. post-merge pełny Quality Gate na `main`,
6. dopiero po jego PASS osobny docs-sync PR aktualizujący wyłącznie dokumenty związane z faktycznie wdrożonym zakresem,
7. pełny GitHub Actions Quality Gate na exact final docs-sync HEAD,
8. merge docs-sync PR i post-merge weryfikacja `main`,
9. dopiero wtedy task może zostać oznaczony jako w pełni zamknięty dokumentacyjnie i można przejść dalej.

Nie łączymy kilku dużych etapów w jeden PR. Starszy PASS nie jest dowodem dla HEAD zmienionego później; finalny status zawsze odnosi się do konkretnego SHA.

---'''
          s = must_sub(s, r'## 2\. Zasada wykonywania\n.*?\n---', execution, 'backlog execution rule', flags=re.S)
          n3 = f'''## NEWSROOM-N3-007 — Author profile integration

### Status implementacji

**DONE w kodzie — PR #77 zmergowany i zweryfikowany na `main@{MAIN}`.** Dokumentacyjny docs-sync jest osobnym krokiem po potwierdzonym post-merge gate.

### Cel

Rozszerzyć istniejący publiczny profil `ContentAuthor` o Newsroom bez tworzenia drugiego modelu autora, drugiej strony profilowej ani rozbieżnej tożsamości schema.

### Stan przed implementacją

- `ContentAuthorController` agregował Traffic Signs i legal content,
- structured data autora było budowane przez traffic-sign-specific `TrafficSignSchemaService::author(...)`,
- article graph używał `SchemaIds::contentAuthorPerson(...)`, ale profil autora nie gwarantował jeszcze wspólnego buildera tej samej tożsamości,
- author sitemap kwalifikował autorów przez starsze moduły contentowe i nie uwzględniał Newsroom-only corpus.

### Aktualny stan implementacji

- `ContentAuthorController` pobiera `authoredContentArticles()->indexable()` wyłącznie z aktywnych kategorii,
- `published` jest dołączane do bieżących publikacji autora, `needs_review` jest renderowane w osobnej sekcji „W trakcie weryfikacji”, a `archived` w osobnym „Archiwum”,
- noindex, scheduled, withdrawn oraz artykuły z nieaktywnych kategorii nie są listowane na publicznym profilu autora,
- `ContentAuthorSchemaService` jest neutralnym, współdzielonym builderem `ProfilePage -> Person`; `SharedAuthorTrafficSignSchemaService` deleguje do niego istniejące traffic-sign schema consumers,
- profil i article graph używają identycznego `SchemaIds::contentAuthorPerson($author)` (`/autorzy/{{slug}}#person`), a `Person.worksFor` wskazuje stabilne `/#organization`,
- `SeoSitemapBuilder::authorUrls()` kwalifikuje autorów również przez indeksowalne artykuły Newsroomu w aktywnych kategoriach; newsroomowa świeżość author sitemap używa maksimum `public_state_changed_at`, nie technicznego `updated_at`,
- model `ContentAuthor` blokuje przejście z publicznego do niepublicznego, gdy istnieje zależny `authoredContentArticles()->indexable()`; po noindex blokada znika,
- nie zmieniono `ContentArticle::dateModified` semantics ani nie utworzono drugiego autora/profile modelu.

### Potwierdzone testy i Quality Gate

- `tests/Feature/ContentAuthorProfileTest.php` pokrywa lifecycle visibility, wspólną tożsamość Person/Organization, public-state freshness author sitemap oraz blokadę/odblokowanie odpublikowania autora,
- exact implementation HEAD `bf7981d23ff99a6335b55ecaeb6ce36b6622a042`: CI #295 — PASS,
- merge commit `main@{MAIN}`: post-merge CI #296 — PASS,
- post-merge `quality`: 1055 passed / 19 540 assertions / 2 skipped, Pint 1055 files PASS, frontend build PASS; `newsroom-postgres` PASS.

### Zakres

- reużyć istniejący `ContentAuthor` i `/autorzy/{{slug}}`,
- utrzymać jedną stabilną tożsamość Person pomiędzy ProfilePage i Article,
- listować `published`, `needs_review+indexable` i `archived+indexable` zgodnie z ich lifecycle semantics; `needs_review` musi być wyraźnie oznaczone i nie może być promowane jako aktywna publikacja,
- wykluczać noindex, draft, scheduled, withdrawn i nieaktywną kategorię,
- rozszerzyć author sitemap o publiczny/indexowalny Newsroom corpus i public-state freshness,
- blokować odpublikowanie autora, jeśli pozostają zależne indeksowalne publikacje Newsroomu.

### DoD

- [x] brak drugiego Newsroom author/profile modelu,
- [x] article -> author URL działa,
- [x] author page -> indexable article działa,
- [x] ProfilePage i Article wskazują identyczne author `Person @id`,
- [x] archived+indexable pozostaje crawlable z profilu i jest oznaczone jako archiwalne; archived+noindex nie musi być listowane,
- [x] `needs_review+indexable` zachowuje inbound przez osobną sekcję „W trakcie weryfikacji” bez aktywnej promocji,
- [x] withdrawn/draft/scheduled nie są listowane,
- [x] zmiana public eligibility wpływa na author-page/sitemap freshness przez `public_state_changed_at` bez fałszowania article `dateModified`,
- [x] próba odpublikowania `ContentAuthor` z zależnym indexable Newsroom article jest blokowana do reassignment/withdraw/noindex,
- [x] exact-head implementation CI i post-merge CI na `main` są PASS.

### Pozostała praca

- NEWSROOM-N3-008 — Public rollout config gate.

---

'''
          s = must_sub(s, r'## NEWSROOM-N3-007 — Author profile integration\n.*?(?=## NEWSROOM-N3-008)', n3, 'backlog N3-007 section', flags=re.S)
          s = re.sub(r'(?m)^(- \[) \](.*N3-007.*)$', r'\1x\2', s)
          s = re.sub(r'(?m)^([^\n]*(?:następn|kolejn)[^\n]*?)N3-007([^\n]*)$', lambda m: m.group(1)+'N3-008'+m.group(2), s, flags=re.I)
          hist = f'''### 2026-09-17 — v0.36

- NEWSROOM-N3-007 implementation PR #77 zmergowano jako `main@{MAIN}` po exact-head CI #295 PASS; post-merge CI #296 również zakończył się pełnym PASS,
- finalny kod reużywa `ContentAuthor`, rozdziela published/needs_review/archived na profilu, współdzieli stabilny Person schema builder i rozszerza author sitemap o Newsroom z `public_state_changed_at`,
- modelowy invariant blokuje odpublikowanie autora z zależnym indexable Newsroom article; `ContentAuthorProfileTest` pokrywa lifecycle, schema, sitemap freshness i unpublish guard,
- skorygowano wcześniejszy sprzeczny zapis zakresu: `needs_review+indexable` nie jest wykluczane z profilu, tylko pozostaje w osobnej, jawnie oznaczonej sekcji,
- wykonawczy workflow doprecyzowano o legalny split implementation PR -> post-merge main gate -> osobny docs-sync PR z własnym exact-head gate,
- następny task: NEWSROOM-N3-008 — Public rollout config gate.
'''
          s = insert_history(s, r'^# 12\. Historia zmian\s*$', hist, 'backlog history')
          write(p, s)

          # 3) Data/domain spec
          p = 'docs/NEWSROOM-DATA-MODEL-AND-DOMAIN-SPEC.md'
          s = read(p)
          s = must_replace(s, f'main@{OLD} (2026-09-17)', f'main@{MAIN} (2026-09-17)', 'domain verification')
          s = must_replace(s, 'publiczny article stack N3-001..N3-006 obejmuje current-canonical detail, SEO/schema, renderer/Product Bridge i historyczny one-hop 301. N3-007/N3-008, N4 i discovery N5 pozostają dalszym etapem.', 'publiczny article stack N3-001..N3-007 obejmuje current-canonical detail, SEO/schema, renderer/Product Bridge, historyczny one-hop 301 oraz integrację istniejącego profilu autora z Newsroom corpus. N3-008, N4 i discovery N5 pozostają dalszym etapem.', 'domain top state')
          block = f'''\n\n**Aktualny stan implementacji po NEWSROOM-N3-007:**\n\n- nie powstał `NewsroomAuthor`; istniejący `ContentAuthor` i `/autorzy/{{slug}}` pozostają jedyną publiczną author identity,\n- `ContentAuthor` blokuje public -> non-public transition, gdy istnieje zależny `authoredContentArticles()->indexable()`, a noindex usuwa tę blokadę,\n- wspólny `ContentAuthorSchemaService` zapewnia stabilne `/autorzy/{{slug}}#person` i `worksFor -> /#organization` zarówno profilowi, jak i istniejącym schema consumers,\n- author sitemap uwzględnia indeksowalne Newsroom articles w aktywnych kategoriach i używa ich `public_state_changed_at` jako public-state freshness; techniczne `updated_at` artykułu nie zastępuje tej semantyki.\n'''
          s = must_sub(s, r'(## 24\.[^\n]*\n)(.*?)(?=\n## 25\.)', lambda m: m.group(1)+m.group(2).rstrip()+block, 'domain author section', flags=re.S)
          state_insert = f'''\n- NEWSROOM-N3-007 jest wdrożone na `main@{MAIN}`: istniejący author profile agreguje indexable Newsroom corpus z osobnymi lifecycle sections, współdzieli stabilny Person schema builder, author sitemap używa newsroomowego `public_state_changed_at`, a model blokuje odpublikowanie autora z zależnym indexable article,\n'''
          s = must_sub(s, r'(## 43\. Stan implementacji\s*\n)', r'\1'+state_insert, 'domain implementation state')
          hist = f'''### 2026-09-17 — v0.31

- NEWSROOM-N3-007 zmergowano przez PR #77 na `main@{MAIN}` bez nowego author modelu i bez zmiany schema/migracji,
- `ContentAuthor` otrzymał modelowy unpublish invariant względem zależnych `indexable()` Newsroom articles,
- współdzielony `ContentAuthorSchemaService` utrwala tę samą Person identity dla ProfilePage/Article, a author sitemap używa Newsroom `public_state_changed_at`,
- `ContentAuthorProfileTest` oraz exact-head CI #295 i post-merge CI #296 potwierdzają lifecycle, schema identity, sitemap freshness i guard.
'''
          s = insert_history(s, r'^## 45\. Historia zmian\s*$', hist, 'domain history')
          write(p, s)

          # 4) Public UI/UX
          p = 'docs/NEWSROOM-PUBLIC-UI-UX-SPEC.md'
          s = read(p)
          s = must_replace(s, f'main@{OLD}', f'main@{MAIN}', 'ui verification')
          s = s.replace('N3-001..N3-006', 'N3-001..N3-007', 1)
          s = re.sub(r'(?m)^- pełna integracja author profiles z newsroomowym corpus;.*N3-007.*\n', '', s)
          ui_state = f'''\n- NEWSROOM-N3-007: `/autorzy/{{slug}}` agreguje indexable Newsroom corpus; bieżące `published`, osobne „W trakcie weryfikacji” dla `needs_review` i osobne „Archiwum” dla `archived`; noindex/scheduled/withdrawn/inactive-category nie są listowane,\n'''
          s = must_sub(s, r'(## 68\. Status wdrożenia względem tej specyfikacji\s*\n)', r'\1'+ui_state, 'ui implementation status')
          s = re.sub(r'(?m)^.*Najbliższy wykonywalny krok po N3-006.*$', 'Najbliższy wykonywalny krok po N3-007: NEWSROOM-N3-008 — Public rollout config gate.', s)
          hist = f'''### 2026-09-17 — v0.15

- NEWSROOM-N3-007 zmergowano przez PR #77 na `main@{MAIN}` i zmaterializowano publiczny author-profile projection bez tworzenia drugiego profilu,
- profil autora rozdziela bieżące publikacje, `needs_review` i archiwum zgodnie z lifecycle; niepromowalne/noindex stany są filtrowane zgodnie z kontraktem,
- exact-head CI #295 i post-merge CI #296 są PASS; następnym publicznym taskiem pozostaje N3-008.
'''
          s = insert_history(s, r'^## 69\. Historia zmian\s*$', hist, 'ui history')
          write(p, s)

          # 5) SEO/distribution
          p = 'docs/NEWSROOM-SEO-DISTRIBUTION-AND-OBSERVABILITY.md'
          s = read(p)
          s = must_replace(s, f'main@{OLD}', f'main@{MAIN}', 'seo verification')
          s = s.replace('N3-001..N3-006', 'N3-001..N3-007', 1)
          old_author = 'Stan obecny: `ContentAuthorController` i `TrafficSignSchemaService::author()` już renderują publiczny ProfilePage, ale podczas integracji newsroomu jego `mainEntity Person` należy wyrównać do tego samego stabilnego `/autorzy/{slug}#person` i `worksFor -> /#organization`, którego używa article graph. Nie tworzymy drugiego ProfilePage.'
          new_author = 'Stan obecny po NEWSROOM-N3-007: `ContentAuthorSchemaService` jest współdzielonym builderem `ProfilePage -> Person`, a `SharedAuthorTrafficSignSchemaService` deleguje do niego istniejących consumers. ProfilePage i Article używają identycznego stabilnego `/autorzy/{slug}#person` oraz `worksFor -> /#organization`. `SeoSitemapBuilder::authorUrls()` kwalifikuje również autorów przez indeksowalne Newsroom articles w aktywnych kategoriach i używa ich `public_state_changed_at` dla newsroomowego author lastmod zamiast technicznego article `updated_at`. Nie utworzono drugiego ProfilePage.'
          s = must_replace(s, old_author, new_author, 'seo author current state')
          s = re.sub(r'(?m)^- .*author profile aggregation N3-007.*\n', '', s)
          seo_state = f'''\n- NEWSROOM-N3-007: shared ProfilePage/Article Person identity, author-profile Newsroom corpus oraz public-state-aware author sitemap są wdrożone na `main@{MAIN}`,\n'''
          s = must_sub(s, r'(## 68\. Stan implementacji\s*\n)', r'\1'+seo_state, 'seo implementation state')
          hist = f'''### 2026-09-17 — v0.12

- NEWSROOM-N3-007 zmergowano przez PR #77 na `main@{MAIN}`: ProfilePage i Article współdzielą stabilny Person `@id` i Organization reference,
- author sitemap uwzględnia indeksowalne Newsroom corpus i wylicza newsroomową świeżość z `public_state_changed_at`, nie z technicznego `updated_at`,
- `ContentAuthorProfileTest` chroni schema identity i sitemap freshness; exact-head CI #295 i post-merge CI #296 są PASS.
'''
          s = insert_history(s, r'^## 69\. Historia zmian\s*$', hist, 'seo history')
          write(p, s)

          # 6) Test/release runbook
          p = 'docs/NEWSROOM-TEST-RELEASE-AND-ROLLBACK-RUNBOOK.md'
          s = read(p)
          s = must_replace(s, f'main@{OLD}', f'main@{MAIN}', 'runbook verification')
          s = s.replace('N3-001..N3-006', 'N3-001..N3-007', 1)
          s = re.sub(r'(?m)^([^\n]*N3-007[^\n]*(?:pozostaje|pozostają)[^\n]*)$', lambda m: m.group(1).replace('N3-007, ', '').replace('N3-007 i ', ''), s, count=1)
          test_line = '- [x] N3-007 author-profile regression: `tests/Feature/ContentAuthorProfileTest.php` — lifecycle visibility, shared Person/Organization identity, author sitemap public-state freshness i ContentAuthor unpublish guard; CI #295 + post-merge CI #296 PASS,\n'
          s = must_sub(s, r'(## 59\. Pozostałe zadania testowe\s*\n)', r'\1\n'+test_line, 'runbook remaining tests')
          s = s.replace('- [ ] dodać dalsze test files w trakcie N3-007..N5', '- [ ] dodać dalsze test files w trakcie N3-008..N5')
          hist = f'''### 2026-09-17 — v0.19

- NEWSROOM-N3-007 implementation PR #77 zakończył exact-head CI #295 PASS na `bf7981d23ff99a6335b55ecaeb6ce36b6622a042`; post-merge CI #296 PASS na `main@{MAIN}`,
